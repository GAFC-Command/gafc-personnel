<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAFC Personnel</title>
<style>
  :root { --bg:#0e0e0d; --panel:#171715; --field:#232320; --line:#3a3a35; --ink:#f3f0e7; --muted:#a7a295; --gold:#f5b82c; --gold-ink:#1a1405; --red:#e5645a; --green:#6fcf7c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color: var(--gold); }
  header.top { background:var(--panel); border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:5; }
  .bar { max-width:1000px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .bar img { width:44px; height:auto; }
  .bar .title { font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  nav a, button, .btn { background:var(--field); color:var(--ink); border:1px solid var(--line); padding:8px 14px; border-radius:6px; text-decoration:none; font:inherit; cursor:pointer; }
  nav a.on { border-color:var(--gold); color:var(--gold); }
  button.primary, .btn.primary { background:var(--gold); color:var(--gold-ink); border-color:var(--gold); font-weight:700; }
  button.danger { border-color:var(--red); color:var(--red); }
  button:disabled { opacity:.5; cursor:default; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:26px; margin:6px 0 14px; } h2 { font-size:19px; margin:22px 0 8px; color:var(--gold); text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:10px 0; }
  .muted { color:var(--muted); } .err { color:var(--red); } .ok { color:var(--green); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-weight:600; font-size:13px; text-transform:uppercase; }
  input, select, textarea { background:var(--field); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; width:100%; }
  textarea { min-height:90px; resize:vertical; }
  label.lab { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > * { flex:1 1 160px; }
  .checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px 12px; margin:8px 0; }
  .chk { display:flex; align-items:center; gap:8px; } .chk input { width:auto; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--muted); }
  .pill.gold { border-color:var(--gold); color:var(--gold); } .pill.red { border-color:var(--red); color:var(--red); } .pill.green { border-color:var(--green); color:var(--green); }
  .secbar { background:#000; color:var(--gold); font-weight:700; padding:5px 10px; margin:18px 0 8px; font-size:14px; letter-spacing:.04em; }
  .ro dt { color:var(--muted); font-size:13px; margin-top:8px; } .ro dd { margin:2px 0 0; white-space:pre-wrap; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; } .tabs button.on { border-color:var(--gold); color:var(--gold); }
  .center { max-width:480px; margin:12vh auto; text-align:center; } .center img { width:120px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--gold); padding:10px 16px; border-radius:8px; display:none; z-index:10; }
</style>
</head>
<body>
<header class="top"><div class="bar">
  <img id="hdrlogo" alt="GAFC" style="display:none"><span class="title">Global Armed Forces Command</span>
  <nav id="nav"></nav>
</div></header>
<main id="main"><p class="muted">Loading</p></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="forms.js"></script>
<script src="pdfgen.js"></script>
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="app.js"></script>
</body>
</html>
